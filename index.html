<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OKCOMPUTER — Fixed v10</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #040608; --bg1: #0a0e14; --bg2: #121820;
            --border: #1e2632; --up: #00e5a0; --dn: #ff4560;
            --bl: #3b9eff; --t1: #e8eff8; --t2: #8fa3bc;
            --r: 12px; --mono: 'IBM Plex Mono', monospace; --sans: 'Syne', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            height: 100dvh; background: var(--bg0); color: var(--t1); 
            font-family: var(--mono); font-size: 13px; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Fixed Header */
        .hdr { padding: 15px; background: var(--bg1); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .price-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 5px; }
        .price-val { font-family: var(--sans); font-size: 32px; letter-spacing: -1px; }
        .mkt-name { font-size: 10px; color: var(--bl); text-transform: uppercase; font-weight: 600; }

        /* Market Selector Grid (RE-ADDED) */
        .mkt-selector { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 5px; padding: 10px; background: var(--bg0); border-bottom: 1px solid var(--border);
        }
        .mkt-chip { 
            padding: 8px 2px; background: var(--bg2); border: 1px solid var(--border);
            border-radius: 6px; font-size: 9px; text-align: center; color: var(--t2);
        }
        .mkt-chip.active { border-color: var(--bl); color: var(--t1); background: rgba(59, 158, 255, 0.1); }

        /* Tabs */
        .tabs { display: flex; background: var(--bg1); border-bottom: 1px solid var(--border); }
        .tab { flex: 1; padding: 15px; border: none; background: none; color: var(--t2); font-size: 11px; font-weight: 600; }
        .tab.active { color: var(--bl); border-bottom: 2px solid var(--bl); }

        /* Content */
        .content { flex: 1; overflow-y: auto; padding: 15px; }
        .panel { display: none; }
        .panel.active { display: block; }

        /* Progress Card */
        .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 15px; margin-bottom: 15px; }
        .progress-track { height: 8px; background: #000; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--bl); transition: 0.3s; }

        /* Log Entry */
        .log-item { background: var(--bg1); border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .badge-win { background: rgba(0, 229, 160, 0.1); color: var(--up); }
        .badge-miss { background: rgba(255, 69, 96, 0.1); color: var(--dn); }

        #alertPop {
            position: fixed; top: 15px; left: 15px; right: 15px; background: var(--dn);
            color: #000; padding: 15px; border-radius: 10px; font-family: var(--sans);
            font-weight: 800; text-align: center; z-index: 9999; display: none;
        }
    </style>
</head>
<body>

<div id="alertPop">SPIKE IMMINENT - KILL ZONE</div>

<header class="hdr">
    <div style="display: flex; justify-content: space-between; font-size: 10px;">
        <span style="font-weight: 800; letter-spacing: 1px;">OKCOMPUTER_v10</span>
        <span id="status" style="color: var(--up)">● ENGINE_READY</span>
    </div>
    <div class="price-row">
        <div id="price" class="price-val">0.00</div>
        <div id="activeMktDisplay" class="mkt-name">B1000</div>
    </div>
</header>

<div class="mkt-selector" id="mktGrid">
    <!-- Chips generated by JS -->
</div>

<nav class="tabs">
    <button class="tab active" onclick="setTab(0)">ANALYSIS</button>
    <button class="tab" onclick="setTab(1)">HISTORY</button>
</nav>

<main class="content">
    <div id="p0" class="panel active">
        <div class="card">
            <div style="display:flex; justify-content: space-between; font-size: 10px; color: var(--t2);">
                <span>SPIKE PROBABILITY</span>
                <span id="tickLabel">0 / 800</span>
            </div>
            <div id="probBig" style="font-size: 48px; font-family: var(--sans); margin: 5px 0;">0%</div>
            <div class="progress-track"><div id="pBar" class="progress-fill"></div></div>
            <div id="zoneText" style="font-size: 11px; text-align: center; color: var(--t2);">MONITORING MARKET...</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="card" style="text-align: center; padding: 10px;">
                <div style="font-size: 9px; color: var(--t2);">WIN RATE</div>
                <div id="winRate" style="font-size: 18px; font-weight: 600; color: var(--up);">0%</div>
            </div>
            <div class="card" style="text-align: center; padding: 10px;">
                <div style="font-size: 9px; color: var(--t2);">TOTAL SIGNALS</div>
                <div id="totalSigs" style="font-size: 18px; font-weight: 600;">0</div>
            </div>
        </div>
    </div>

    <div id="p1" class="panel">
        <div id="logContainer"></div>
    </div>
</main>

<script>
    const config = [
        { id: 'B1000', name: 'BOOM 1000', avg: 1000 },
        { id: 'B500', name: 'BOOM 500', avg: 500 },
        { id: 'C1000', name: 'CRASH 1000', avg: 1000 },
        { id: 'C500', name: 'CRASH 500', avg: 500 }
    ];

    let state = {
        mkt: config[0],
        price: 5000.00,
        ticks: 0,
        wins: 0,
        total: 0,
        isAlerting: false
    };

    // Build Market Selector
    const mktGrid = document.getElementById('mktGrid');
    config.forEach(item => {
        const chip = document.createElement('div');
        chip.className = `mkt-chip ${item.id === state.mkt.id ? 'active' : ''}`;
        chip.id = `chip-${item.id}`;
        chip.innerText = item.id;
        chip.onclick = () => {
            document.querySelectorAll('.mkt-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            state.mkt = item;
            state.ticks = 0;
            state.isAlerting = false;
            document.getElementById('activeMktDisplay').innerText = item.id;
        };
        mktGrid.appendChild(chip);
    });

    function setTab(idx) {
        document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
    }

    function addLog(type, ticks) {
        const container = document.getElementById('logContainer');
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
            <div>
                <div style="font-weight:600">${state.mkt.id}</div>
                <div style="font-size:10px; color:var(--t2)">Tick Window: ${ticks}</div>
            </div>
            <span class="badge ${type === 'WIN' ? 'badge-win' : 'badge-miss'}">${type}</span>
        `;
        container.prepend(item);
        state.total++;
        if(type === 'WIN') state.wins++;
        document.getElementById('winRate').innerText = Math.round((state.wins/state.total)*100) + '%';
        document.getElementById('totalSigs').innerText = state.total;
    }

    function engine() {
        // Price Movement
        state.price += (Math.random() * 0.4) - 0.2;
        state.ticks++;

        // UI Updates
        document.getElementById('price').innerText = state.price.toFixed(2);
        document.getElementById('tickLabel').innerText = `${state.ticks} / ${state.mkt.avg}`;
        
        let pct = (state.ticks / state.mkt.avg) * 100;
        document.getElementById('pBar').style.width = Math.min(pct, 100) + '%';
        document.getElementById('probBig').innerText = Math.round(pct) + '%';

        // Signal Logic
        const alertPop = document.getElementById('alertPop');
        if (pct > 85) {
            state.isAlerting = true;
            alertPop.style.display = 'block';
            document.getElementById('zoneText').innerText = "KILL ZONE ACTIVE";
            document.getElementById('zoneText').style.color = "var(--dn)";
        } else {
            alertPop.style.display = 'none';
            document.getElementById('zoneText').innerText = "MARKET STABLE";
            document.getElementById('zoneText').style.color = "var(--t2)";
        }

        // Spike Trigger (Simulation)
        if (Math.random() > 0.99) {
            state.price += (Math.random() * 30) + 10; // The Spike
            addLog(state.isAlerting ? 'WIN' : 'MISS', state.ticks);
            state.ticks = 0;
            state.isAlerting = false;
        }

        // Timeout Miss
        if (state.ticks > state.mkt.avg * 1.2) {
            addLog('MISS', state.ticks);
            state.ticks = 0;
            state.isAlerting = false;
        }
    }

    setInterval(engine, 600);
</script>

</body>
</html>
