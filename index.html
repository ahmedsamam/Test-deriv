<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Boom 1000 Prediction Engine</title>
    <style>
        :root {
            --bg: #050505; --green: #34C759; --red: #FF3B30; --blue: #007AFF;
        }
        body {
            margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .container { flex: 1; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        header { padding: 20px; text-align: center; border-bottom: 1px solid #222; }
        .display { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #price { font-size: 5rem; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
        .stats { display: flex; justify-content: space-around; padding: 20px; background: #111; border-top: 1px solid #222; }
        .item { text-align: center; }
        .label { font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .val { font-size: 14px; font-weight: bold; }
        #btn { background: var(--blue); color: #fff; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #alert { display: none; position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: var(--red); padding: 15px 40px; border-radius: 50px; font-weight: bold; animation: pulse 1s infinite; z-index: 10; }
        @keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="color: #888; font-size: 12px; margin-bottom: 10px;">BOOM 1000 • 90% LOGIC</div>
        <button id="btn">ACTIVATE & CONNECT</button>
    </header>

    <div class="display">
        <h1 id="price">0000.00</h1>
        <div id="status" style="color: #FF9500; font-size: 12px;">READY TO CONNECT</div>
    </div>

    <div id="alert">⚠️ SPIKE INCOMING</div>

    <div class="stats">
        <div class="item"><div class="label">Probability</div><div class="val" id="p-val">---</div></div>
        <div class="item"><div class="label">Squeeze</div><div class="val" id="s-val">---</div></div>
        <div class="item"><div class="label">Warm-up</div><div class="val" id="w-val">0/50</div></div>
    </div>
</div>

<script>
    // --- PASTE YOUR TOKEN BELOW ---
    const TOKEN = "JqxVdEn5i5PsoLt"; 
    const APP_ID = "1089"; // Public App ID for Deriv

    const LOGIC = { K: 3.2, LIMIT: 50 };
    let history = [];
    let audioCtx = null;
    const priceEl = document.getElementById('price');
    const alertEl = document.getElementById('alert');

    document.getElementById('btn').addEventListener('click', function() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        this.style.display = 'none';
        initWS();
    });

    function initWS() {
        const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);

        ws.onopen = () => {
            document.getElementById('status').innerText = "AUTHORIZING...";
            ws.send(JSON.stringify({ authorize: TOKEN }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if (data.msg_type === 'authorize') {
                document.getElementById('status').innerText = "SUBSCRIBING...";
                ws.send(JSON.stringify({ ticks: "R_100", subscribe: 1 }));
            }
            if (data.tick) {
                update(data.tick.quote);
            }
        };

        ws.onclose = () => {
            document.getElementById('status').innerText = "RECONNECTING...";
            setTimeout(initWS, 3000);
        };
    }

    function update(quote) {
        priceEl.innerText = parseFloat(quote).toFixed(2);
        history.push(parseFloat(quote));
        if (history.length > LOGIC.LIMIT) history.shift();

        document.getElementById('w-val').innerText = `${history.length}/${LOGIC.LIMIT}`;

        if (history.length >= LOGIC.LIMIT) {
            run(parseFloat(quote));
        }
    }

    function run(current) {
        document.getElementById('status').innerText = "90% LOGIC ACTIVE";
        document.getElementById('status').style.color = "#34C759";

        const mean = history.reduce((a, b) => a + b) / history.length;
        const stdDev = Math.sqrt(history.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b) / history.length);
        
        const isSqueezed = stdDev < (mean * 0.0001); // Volatility Contraction
        document.getElementById('s-val').innerText = isSqueezed ? "ACTIVE" : "LOW";
        document.getElementById('s-val').style.color = isSqueezed ? "#34C759" : "#888";

        // Prediction Cluster: Squeeze + 1.5 StdDev Momentum
        if (isSqueezed && current > (mean + (stdDev * 1.5))) {
            trigger();
        }
    }

    function trigger() {
        alertEl.style.display = 'block';
        priceEl.style.color = "#FF3B30";
        document.getElementById('p-val').innerText = "90%";
        document.getElementById('p-val').style.color = "#FF3B30";

        if (audioCtx && audioCtx.state === 'running') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
            osc.start(); osc.stop(audioCtx.currentTime + 0.8);
        }

        setTimeout(() => {
            alertEl.style.display = 'none';
            priceEl.style.color = "#34C759";
        }, 2500);
    }
</script>
</body>
</html>
