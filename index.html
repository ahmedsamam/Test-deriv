<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OKCOMPUTER — Compact v12.1</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #020406; --bg1: #080c12; --bg2: #0f1720;
            --border: #1a222d; --up: #00ffaa; --dn: #ff2d55;
            --bl: #00a2ff; --gl: #f0f4f8; --r: 10px;
            --sans: 'Syne', sans-serif; --mono: 'IBM Plex Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            height: 100dvh; background: var(--bg0); color: var(--gl); 
            font-family: var(--mono); font-size: 12px; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Compact Header */
        .hdr { padding: 12px 15px; background: var(--bg1); border-bottom: 1px solid var(--border); }
        .price-label { font-size: 9px; color: var(--bl); font-weight: 800; letter-spacing: 1px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; }
        .price-val { font-family: var(--sans); font-size: 32px; letter-spacing: -1.5px; }

        /* Market Selector - Reduced Height */
        .mkt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; background: var(--bg0); }
        .mkt-btn { 
            padding: 6px 0; background: var(--bg2); border: 1px solid var(--border);
            border-radius: 6px; font-size: 9px; text-align: center; color: #5c708a;
        }
        .mkt-btn.active { border-color: var(--bl); color: #fff; background: rgba(0, 162, 255, 0.1); }

        /* Metrics Bar - Slim */
        .metrics-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
        .m-box { background: var(--bg1); padding: 8px; text-align: center; }
        .m-lbl { font-size: 7px; color: #5c708a; margin-bottom: 2px; }
        .m-val { font-weight: 600; font-size: 12px; }

        /* Main Display - Scaled Down */
        .stage { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; }
        .quantum-card { 
            background: linear-gradient(160deg, var(--bg2), var(--bg0));
            border: 1px solid var(--border); border-radius: var(--r); padding: 15px;
            position: relative; margin-bottom: 12px; flex-shrink: 0;
        }
        
        .prob-large { font-family: var(--sans); font-size: 52px; text-align: center; margin: 5px 0; line-height: 1; }
        
        /* Compact Logs */
        .log-container { flex: 1; overflow-y: auto; }
        .log-row { 
            background: var(--bg1); padding: 8px 12px; border-radius: 6px; 
            margin-bottom: 4px; display: flex; justify-content: space-between; 
            align-items: center; border-left: 2px solid transparent; font-size: 11px;
        }
        .win { border-left-color: var(--up); }
        .miss { border-left-color: var(--dn); }

        .squeeze-bar { height: 3px; background: #000; border-radius: 2px; margin: 12px 0; overflow: hidden; }
        .sq-fill { height: 100%; transition: width 0.3s; }

        #masterAlert {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            border: 6px solid var(--dn); z-index: 9999; pointer-events: none; display: none;
            animation: flash 0.3s infinite alternate;
        }
        @keyframes flash { from { opacity: 0.1; } to { opacity: 0.5; } }
    </style>
</head>
<body>

<div id="masterAlert"></div>

<header class="hdr">
    <div class="price-label">QUANTUM_V12.1_COMPACT</div>
    <div class="price-row">
        <div id="price" class="price-val">0.00</div>
        <div id="mktLabel" style="font-size:10px; color:var(--bl); font-weight:800;">BOOM 1000</div>
    </div>
</header>

<div class="mkt-grid" id="mktGrid"></div>

<div class="metrics-row">
    <div class="m-box"><div class="m-lbl">WIN RATE</div><div id="winRate" class="m-val" style="color:var(--up)">0%</div></div>
    <div class="m-box"><div class="m-lbl">VOLATILITY</div><div id="volVal" class="m-val">STABLE</div></div>
    <div class="m-box"><div class="m-lbl">SQUEEZE</div><div id="sqVal" class="m-val">LOW</div></div>
</div>

<main class="stage">
    <div class="quantum-card">
        <div style="text-align:center; font-size:8px; color:#5c708a; letter-spacing:2px;">SPIKE PROBABILITY</div>
        <div id="probDisplay" class="prob-large">0%</div>
        <div class="squeeze-bar"><div id="pBar" class="sq-fill" style="background:var(--bl); width:0%;"></div></div>
        <div style="display:flex; justify-content:space-between; font-size:9px;">
            <span id="tickStatus">TICK: 0/1000</span>
            <span id="stateTxt" style="font-weight:800; color:#5c708a">MONITORING</span>
        </div>
    </div>

    <div style="font-size:9px; color:#5c708a; margin-bottom:8px; font-weight:800; letter-spacing:1px;">QUANTUM_HISTORY_LOG</div>
    <div class="log-container" id="logs"></div>
</main>

<script>
    const mktConfigs = [
        { id: 'B1000', avg: 1000, color: '#00ffaa' },
        { id: 'B500', avg: 500, color: '#00ffaa' },
        { id: 'C1000', avg: 1000, color: '#ff2d55' },
        { id: 'C500', avg: 500, color: '#ff2d55' }
    ];

    let engine = {
        mkt: mktConfigs[0],
        price: 5000,
        ticks: 0,
        lastPrices: [0,0,0,0,0],
        stats: { wins: 0, total: 0 },
        alertLevel: 0
    };

    const grid = document.getElementById('mktGrid');
    mktConfigs.forEach(m => {
        const b = document.createElement('div');
        b.className = `mkt-btn ${m.id === engine.mkt.id ? 'active' : ''}`;
        b.innerText = m.id;
        b.onclick = () => {
            document.querySelectorAll('.mkt-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            engine.mkt = m; engine.ticks = 0;
            document.getElementById('mktLabel').innerText = m.id;
            document.getElementById('mktLabel').style.color = m.color;
        };
        grid.appendChild(b);
    });

    function run() {
        let change = (Math.random() * 0.4) - 0.2;
        engine.price += change; engine.ticks++;
        engine.lastPrices.push(engine.price); engine.lastPrices.shift();

        let base = (engine.ticks / engine.mkt.avg) * 100;
        let range = Math.max(...engine.lastPrices) - Math.min(...engine.lastPrices);
        let squeeze = range < 0.12 ? 15 : 0;
        let prob = Math.min(Math.round(base + squeeze), 99);

        document.getElementById('price').innerText = engine.price.toFixed(2);
        document.getElementById('probDisplay').innerText = prob + '%';
        document.getElementById('pBar').style.width = prob + '%';
        document.getElementById('tickStatus').innerText = `TICK: ${engine.ticks}/${engine.mkt.avg}`;
        document.getElementById('volVal').innerText = range < 0.2 ? 'STABLE' : 'HIGH';
        document.getElementById('sqVal').innerText = squeeze > 0 ? 'CRITICAL' : 'LOW';

        const alertOverlay = document.getElementById('masterAlert');
        const stateTxt = document.getElementById('stateTxt');

        if (prob >= 90) {
            engine.alertLevel = 2;
            alertOverlay.style.display = 'block';
            stateTxt.innerText = "EXECUTE"; stateTxt.style.color = "var(--dn)";
        } else if (prob >= 75) {
            engine.alertLevel = 1;
            alertOverlay.style.display = 'none';
            stateTxt.innerText = "PREPARE"; stateTxt.style.color = "#f5a623";
        } else {
            engine.alertLevel = 0;
            alertOverlay.style.display = 'none';
            stateTxt.innerText = "MONITORING"; stateTxt.style.color = "#5c708a";
        }

        if (Math.random() > 0.994) {
            let spike = (Math.random() * 25) + 15;
            engine.price += (engine.mkt.id.startsWith('B')) ? spike : -spike;
            logEvent(engine.alertLevel >= 1 ? 'WIN' : 'MISS');
            engine.ticks = 0;
        }
        if (engine.ticks > engine.mkt.avg * 1.3) { logEvent('MISS'); engine.ticks = 0; }
    }

    function logEvent(type) {
        const logs = document.getElementById('logs');
        const row = document.createElement('div');
        row.className = `log-row ${type.toLowerCase()}`;
        row.innerHTML = `<span>${engine.mkt.id} SIGNAL</span><span style="font-weight:800; color:${type==='WIN'?'var(--up)':'var(--dn)'}">${type}</span>`;
        logs.prepend(row);
        engine.stats.total++; if(type === 'WIN') engine.stats.wins++;
        document.getElementById('winRate').innerText = Math.round((engine.stats.wins/engine.stats.total)*100) + '%';
    }

    setInterval(run, 650);
</script>
</body>
</html>
